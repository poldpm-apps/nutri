<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nutrició">
  <title>Nutrició</title>
  <!--
    Variant «maskable» per a Android. El sistema retalla la icona amb la
    forma que vol —cercle, gota, quadrat arrodonit— i el que queda fora del
    cercle central del 80 % es pot perdre. El fons va a sang i la sigla es
    redueix fins a cabre-hi sencera, bandereta i meta incloses.
  -->
  <rect width="512" height="512" fill="#0b0b0c"/>
  <g transform="translate(256 262) scale(0.74) translate(-251 -269)">
    <path d="M118 420V92h74l96 196V92h66v328h-74l-96-196v196z" fill="#fbfcfd"/>
    <path d="M354 92l88 38-88 38z" fill="#ff5a1f"/>
    <path d="M60 446h392" stroke="#ff5a1f" stroke-width="10"/>
  </g>
</svg>
