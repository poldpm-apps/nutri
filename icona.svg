<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Nutrició">
  <title>Nutrició</title>
  <!--
    LA SIGLA. Una N de dorsal, condensada i blanca sobre tinta, amb la
    bandereta taronja del punt de control a l'espatlla i la línia de meta a
