<style>
/* =========================================================================
   NUTRICIÓ — EL POLS
   =========================================================================

   El mateix món que l'app del cos, perquè són germanes: un catàleg de
   Factory Records —Unknown Pleasures, Peter Saville— traslladat al camp
   pàl·lid. Filets en rampa de turquesa, números de catàleg, versaletes
   gravades, i gairebé res imprès. Regles i alineació; cap targeta.

   La peça de Nutrició és el POLS DEL BALANÇ: cada dia és una carena plana
   amb un pols a la posició del seu balanç. L'equilibri és el mig, el dèficit
   cap a la dreta, i l'objectiu una línia de traços que es travessa. La
   setmana i el mes són les carenes apilades, l'una darrere l'altra.

   Una sola font —Hanken Grotesk—, tres pesos. Un sol color d'avís, l'ocre,
   i només per al que s'ha de corregir: el superàvit i els errors.
   ========================================================================= */

@font-face {
  font-family: "Hanken Grotesk";
  src: url("fonts/hanken-grotesk.woff2") format("woff2");
  font-weight: 400 600; font-style: normal; font-display: swap;
}

:root {
  color-scheme: light;

  /* --- el camp i la rampa (la de la icona del cos) --- */
  --camp:     #e8eef0;   /* el camp sense imprimir */
  --camp-alt: #f3f6f7;   /* seleccionat, a sobre */
  --blanc:    #fbfcfc;
  --pagina:   #cfd8db;   /* el que queda fora del camp, i la cortina */
  --t1: #bcced4; --t2: #7ab5c1; --t3: #1c8496; --t4: #054a57;
  --tinta:    #0d191e;
  --tinta-2:  #3d5560;   /* text secundari: 6,7:1 sobre el camp */
  --fil:      #9fb4bb;   /* filets de regla */
  --fil-fort: #0d191e;
  --ocre:     #85580f;   /* l'únic avís: 5,2:1 */
  --ocre-suau:#f3ead9;
  --apagat:   #6f858d;   /* desactivat: només per a vores i coses que no es llegeixen */

  --font: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

  /* --- escala: 4 / 8 / 12 / 16 / 20 / 24 / 32 --- */
  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px; --e5: 20px; --e6: 24px; --e7: 32px;
  --gutter: 16px;
  --toc: 44px;

  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);

  --z-marca: 4; --z-avisos: 20; --z-fosc: 50; --z-brindis: 60;
}

/* ------------------------------------------------------------------ base */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--camp); }
@media (pointer: fine) { html { overscroll-behavior: none; } }
body {
  margin: 0; min-height: 100dvh;
  background: var(--camp); color: var(--tinta);
  font-family: var(--font); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
h1, h2, h3, p, dl, dd, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1, h2, h3 { text-wrap: balance; }
hr { border: 0; border-top: 1px solid var(--fil); margin: var(--e2) 0; }

.nomes-lectors {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--t4); outline-offset: 2px; }

/* --- tipus: el gravat del catàleg --- */
.gravat, .marge {
  font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--tinta-2); line-height: 1.3;
}
.gravat.tinta { color: var(--tinta); }   /* «tinta» i no «fosc»: .fosc és la cortina de les finestres */
.num-cat { font-weight: 600; color: var(--tinta); letter-spacing: .1em; }
.menut { font-size: 14px; color: var(--tinta-2); line-height: 1.45; }
.num { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- icones */

.ic { width: 24px; height: 24px; display: block; flex: none; fill: none;
      stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic-p { width: 18px; height: 18px; }
.ic-g { width: 32px; height: 32px; stroke-width: 1.4; }

/* ---------------------------------------------------------------- botons */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e2);
  min-height: var(--toc); padding: 0 var(--e4);
  border: 1px solid var(--tinta); border-radius: 0; background: transparent; color: var(--tinta);
  font-size: 14px; font-weight: 600; letter-spacing: .02em; line-height: 1.2; text-align: center;
  cursor: pointer; text-decoration: none;
  transition: transform 120ms var(--ease-out), background-color 150ms ease, color 150ms ease;
}
.btn:active { transform: scale(.97); }
.btn-primari { background: var(--tinta); color: var(--blanc); }
.btn-secundari { background: transparent; }
.btn-fosc { background: var(--tinta); color: var(--blanc); }
.btn-fantasma { border-color: transparent; }
.btn-icona { width: var(--toc); min-width: var(--toc); padding: 0; }
.btn-ple { width: 100%; }
.btn:disabled { border-color: var(--fil); color: var(--apagat); background: transparent; cursor: not-allowed; }
.btn:disabled:active { transform: none; }
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover { background: var(--camp-alt); }
  .btn-primari:not(:disabled):hover, .btn-fosc:not(:disabled):hover { background: #1d2c32; }
}
.btn[data-carregant="1"] { color: transparent; position: relative; pointer-events: none; }
.btn[data-carregant="1"]::after {
  content: ""; position: absolute; width: 16px; height: 16px;
  border: 1.5px solid var(--tinta); border-top-color: transparent; border-radius: 50%;
  animation: gira .7s linear infinite;
}
.btn-primari[data-carregant="1"]::after, .btn-fosc[data-carregant="1"]::after { border-color: var(--blanc); border-top-color: transparent; }
@keyframes gira { to { transform: rotate(360deg); } }

.enllac {
  display: inline-flex; align-items: center; gap: var(--e1); min-height: var(--toc); padding: 0 2px;
  border: 0; background: none; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--tinta);
}
@media (hover: hover) and (pointer: fine) { .enllac:hover { text-decoration: underline; text-underline-offset: 3px; } }

/* ---------------------------------------------------------------- camps */

.camp { display: block; }
.camp + .camp, .avis + .camp { margin-top: var(--e4); }
.camp > span { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-2); }
.entrada {
  width: 100%; min-height: var(--toc); padding: 0 var(--e3);
  border: 1px solid var(--tinta); border-radius: 0; background: var(--blanc);
  font-size: 16px; font-weight: 500;
}
.entrada::placeholder { color: var(--tinta-2); opacity: .75; font-weight: 400; }
.entrada:focus-visible { outline: 2px solid var(--t4); outline-offset: -1px; }
.entrada[aria-invalid="true"] { border-color: var(--ocre); outline: 1px solid var(--ocre); outline-offset: -2px; }
input[type="file"].entrada { padding: var(--e3); font-size: 14px; }
.camp-mal {
  margin: var(--e2) 0 0; padding: var(--e2) 0 var(--e2) var(--e3);
  border-left: 2px solid var(--ocre); color: var(--ocre);
  font-size: 14px; font-weight: 600; line-height: 1.4;
}
.camp-mal[hidden] { display: none; }

/* -------------------------------------------------------- la carcassa */

#vista { min-height: 60dvh; }
.vista-capsa { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
.envoltori { max-width: 1120px; margin: 0 auto; }

.sense-xarxa {
  position: sticky; top: 0; z-index: var(--z-avisos);
  display: flex; align-items: center; justify-content: center; gap: var(--e2);
  padding: var(--e2) var(--gutter); background: var(--tinta); color: var(--blanc);
  font-size: 14px; font-weight: 500; text-align: center;
}
.sense-xarxa[hidden] { display: none; }
#pendents { background: var(--ocre-suau); color: var(--ocre); font-weight: 600; }

.marca-versio {
  position: fixed; right: 8px; z-index: var(--z-marca); pointer-events: none;
  bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  font-size: 11px; letter-spacing: .08em; color: var(--tinta-2); opacity: .8;
}

/* La càrrega: els filets on aniran la carena i les xifres, respirant. */
.marques { display: grid; gap: 22px; padding: 40px var(--gutter); max-width: 1120px; margin: 0 auto; }
.esquelet { height: 1px; background: var(--fil); animation: respira 1.4s ease-in-out infinite; }
.esquelet:first-child { height: 120px; background: repeating-linear-gradient(to bottom, var(--t1) 0 1px, transparent 1px 11px); }
@keyframes respira { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

.estat {
  margin: var(--e7) var(--gutter); padding: var(--e4) 0;
  border-top: 1px solid var(--fil-fort); border-bottom: 1px solid var(--fil);
  display: grid; gap: var(--e3); justify-items: start;
}
.estat .ic { color: var(--ocre); }
.estat h2 { font-size: 28px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
.estat p { color: var(--tinta-2); max-width: 40ch; overflow-wrap: anywhere; }
.estat .btn { width: 100%; }

.brindis {
  position: fixed; left: var(--gutter); right: var(--gutter);
  bottom: calc(var(--e4) + env(safe-area-inset-bottom, 0px));
  z-index: var(--z-brindis); max-width: 480px; margin: 0 auto;
  display: flex; align-items: center; gap: var(--e3);
  padding: var(--e3) var(--e4); background: var(--tinta); color: var(--blanc);
  font-size: 14px; font-weight: 500; line-height: 1.4;
  transform: translateY(12px); opacity: 0; visibility: hidden;
  transition: transform 240ms var(--ease-out), opacity 160ms ease, visibility 0s linear 240ms;
}
.brindis .ic { color: var(--t2); }
.brindis[data-visible="1"] { transform: none; opacity: 1; visibility: visible;
  transition: transform 240ms var(--ease-out), opacity 160ms ease, visibility 0s; }
.brindis[data-to="error"] { background: var(--ocre); }
.brindis[data-to="error"] .ic { color: var(--blanc); }

/* --- els fulls que pugen --- */
.fosc {
  position: fixed; inset: 0; z-index: var(--z-fosc);
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(13, 25, 30, .45); opacity: 0; pointer-events: none; transition: opacity 200ms ease;
}
.fosc[data-obert="1"] { opacity: 1; pointer-events: auto; }
.modal {
  width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--camp); color: var(--tinta);
  padding: 0 var(--gutter) calc(var(--e6) + env(safe-area-inset-bottom, 0px));
  transform: translateY(100%); transition: transform 320ms var(--ease-drawer);
}
.fosc[data-obert="1"] .modal { transform: none; }
.modal-cap {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; gap: var(--e3);
  margin: 0 calc(-1 * var(--gutter)) var(--e4); padding: var(--e3) var(--e2) var(--e2) var(--gutter);
  background: var(--camp); border-bottom: 1px solid var(--fil-fort);
}
.modal-cap h2 { flex: 1; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
@media (min-width: 900px) { .fosc { align-items: center; } }

.form-ajustos { display: grid; gap: var(--e4); }
.form-ajustos label { display: block; }
.form-ajustos label > span { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-2); }
.form-ajustos input:not([type="file"]) {
  width: 100%; min-height: var(--toc); padding: 0 var(--e3);
  border: 1px solid var(--tinta); border-radius: 0; background: var(--blanc); font-size: 16px; font-weight: 500;
}
.form-ajustos input:focus-visible { outline: 2px solid var(--t4); outline-offset: -1px; }
.form-ajustos p { color: var(--tinta-2); }
.form-ajustos h3 { margin-top: var(--e2); }

/* =========================================================================
   LA PANTALLA DE NUTRICIÓ
   ========================================================================= */

/* --- capçalera --- */
.cap { display: flex; align-items: center; justify-content: space-between; min-height: 56px;
       padding: max(8px, env(safe-area-inset-top)) 8px 0 var(--gutter); }
.marca { display: flex; align-items: center; gap: var(--e2); color: var(--t4); }
.marca .ic { width: 24px; height: 24px; stroke-width: 1.5; }
.titol { padding: 18px var(--gutter) 0; }
.titol h1 { font-size: 28px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
.titol p { margin-top: 6px; font-size: 14px; color: var(--tinta-2); }

.periodes { display: flex; gap: var(--e5); margin: var(--e3) var(--gutter) 0; }
.periodes button {
  min-height: var(--toc); padding: 0; border: 0; background: none; cursor: pointer;
  font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-2);
  box-shadow: inset 0 -2px 0 transparent; transition: color 150ms ease, box-shadow 150ms ease;
}
.periodes button[aria-pressed="true"] { color: var(--tinta); box-shadow: inset 0 -2px 0 var(--t4); }
@media (hover: hover) and (pointer: fine) { .periodes button:hover { color: var(--tinta); } }

.dies {
  display: flex; align-items: center; justify-content: space-between;
  margin: var(--e2) var(--gutter) 0; border-top: 1px solid var(--fil-fort); border-bottom: 1px solid var(--fil);
}
.fletxa {
  width: var(--toc); height: var(--toc); display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: none; cursor: pointer; color: var(--tinta);
  transition: transform 120ms var(--ease-out);
}
.fletxa:active { transform: scale(.94); }
.fletxa:disabled { color: #8ea2a9; cursor: not-allowed; }
.fletxa:disabled:active { transform: none; }
.dia-actual { display: flex; align-items: center; gap: var(--e3); min-width: 0; }
.dia-actual > span { font-size: 14px; font-weight: 600; }
.a-avui { min-height: var(--toc); padding: 0 2px; border: 0; background: none; cursor: pointer;
          font-size: 14px; font-weight: 600; color: var(--t4); text-decoration: underline; text-underline-offset: 3px; }

/* --- el reclam dels avisos --- */
.crida-avisos {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  margin: var(--e5) var(--gutter) 0; padding: 14px 0;
  border-top: 1px solid var(--fil-fort); border-bottom: 1px solid var(--fil);
}
.crida-avisos .ic { display: none; }
.crida-avisos p { font-size: 14px; color: var(--tinta-2); }
.crida-avisos .btn { grid-column: 2; }

/* --- disposició --- */
.curs { display: grid; }
.columna { display: grid; align-content: start; min-width: 0; }

/* --- el veredicte i el pols --- */
.veredicte { padding: 30px var(--gutter) 0; }
.veredicte .v { margin-top: var(--e2); font-size: 36px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; }
.veredicte .v[data-estat="superavit"] { color: var(--ocre); }
.veredicte .v[data-estat="sense_dades"] { color: var(--tinta-2); }
.pols { display: block; width: 100%; height: auto; margin-top: 14px; overflow: visible; }
.pols .r { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.pols .f { fill: var(--camp); }
.pols text { font-family: var(--font); font-size: 12px; font-weight: 600; letter-spacing: .1em; fill: var(--tinta); }
.pols text.suau { fill: var(--tinta-2); }
.pols .cp { stroke: var(--t4); stroke-width: 1; stroke-dasharray: 2 4; }
.pols .zero { stroke: var(--tinta); stroke-width: 1; }
.pols-llegenda { display: flex; justify-content: space-between; margin-top: 6px; }

/* --- les quatre xifres --- */
.xifres { display: grid; grid-template-columns: 1fr 1fr; margin: var(--e6) var(--gutter) 0; border-top: 1px solid var(--fil-fort); }
.xifra { min-width: 0; padding: 14px 0 16px; border-bottom: 1px solid var(--fil); }
.xifra:nth-child(odd) { padding-right: var(--e3); border-right: 1px solid var(--fil); }
.xifra:nth-child(even) { padding-left: var(--e4); }
.xifra .gran { display: flex; align-items: baseline; gap: 5px; margin-top: 6px; white-space: nowrap; }
.xifra .n { font-size: 40px; font-weight: 500; letter-spacing: -.03em; line-height: 1; }
.xifra .u { font-size: 15px; font-weight: 500; color: var(--tinta-2); }
.xifra .d { margin-top: 6px; font-size: 14px; color: var(--tinta-2); }
.xifra .d[data-fet] { color: var(--t4); font-weight: 600; }
.xifra .d[data-avis] { color: var(--ocre); font-weight: 600; }

/* --- seccions amb regla --- */
.sec { padding: 28px var(--gutter) 0; }
.sec-cap { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e3);
           padding-bottom: 10px; border-bottom: 1px solid var(--fil-fort); }
.sec-cap h2 { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta); }

/* --- els àpats: un parcial cada un --- */
.apat + .apat { margin-top: var(--e2); }
.apat-cap { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e3);
            padding: 14px 0 6px; border-bottom: 1px solid var(--fil); }
.apat-cap h3 { font-size: 17px; font-weight: 600; letter-spacing: -.005em; display: flex; align-items: baseline; gap: 10px; }
.apat-tot { font-size: 14px; font-weight: 600; white-space: nowrap; }
.apat-tot[data-buit] { color: var(--tinta-2); font-weight: 500; }
.ingesta { display: grid; grid-template-columns: minmax(0, 1fr) auto var(--toc); gap: 2px 10px; align-items: center;
           min-height: 56px; padding: 10px 0; border-bottom: 1px solid var(--fil); }
.ingesta-nom { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.ingesta-espec { margin-top: 2px; font-size: 13px; color: var(--tinta-2); }
.ingesta-espec span + span::before { content: " · "; }
.ingesta-surt { text-align: right; line-height: 1.2; white-space: nowrap; font-size: 15px; font-weight: 600; }
.ingesta-surt .ku { margin-left: 2px; font-size: 13px; font-weight: 500; color: var(--tinta-2); }
.ingesta-surt .p { display: block; font-size: 13px; font-weight: 500; color: var(--tinta-2); }
.treu { width: var(--toc); height: var(--toc); display: grid; place-items: center; margin-right: -12px;
        border: 0; background: none; cursor: pointer; color: var(--tinta-2);
        transition: transform 120ms var(--ease-out), color 150ms ease; }
.treu:active { transform: scale(.94); }
@media (hover: hover) and (pointer: fine) { .treu:hover { color: var(--tinta); } }
.apat-buit { padding: 12px 0; font-size: 14px; color: var(--tinta-2); border-bottom: 1px solid var(--fil); }
.obre-form { margin-top: var(--e3); }
.obre-form[aria-expanded="true"] { display: none; }

.inscripcio { margin-top: var(--e3); padding: var(--e3) 0 var(--e4); border-top: 1px solid var(--fil-fort); border-bottom: 1px solid var(--fil); }
.inscripcio[hidden] { display: none; }
.inscripcio-franja { display: flex; justify-content: space-between; align-items: center; gap: var(--e2); margin-bottom: var(--e2); }
.inscripcio-franja span { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta); }
.inscripcio-franja button { min-height: var(--toc); margin: -8px 0; padding: 0 2px; border: 0; background: none; cursor: pointer;
                            font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.inscripcio-cos { display: grid; gap: var(--e3); }
.tria { justify-content: space-between; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e2); }
.inscripcio label { display: block; }
.inscripcio label > span { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-2); }
.inscripcio input { width: 100%; min-height: var(--toc); padding: 0 var(--e3); border: 1px solid var(--tinta); border-radius: 0;
                    background: var(--blanc); font-size: 16px; font-weight: 500; }
.inscripcio input:focus-visible { outline: 2px solid var(--t4); outline-offset: -1px; }
.inscripcio input[aria-invalid="true"] { border-color: var(--ocre); outline: 1px solid var(--ocre); outline-offset: -2px; }
.inscripcio-accions { display: grid; gap: var(--e2); }

/* --- el tancament --- */
.meta-cos { display: grid; gap: var(--e3); padding-top: var(--e3); }
.cremades { display: grid; grid-template-columns: 1fr auto; border: 1px solid var(--tinta); background: var(--blanc); }
.cremades:focus-within { outline: 2px solid var(--t4); outline-offset: -1px; }
.cremades input { width: 100%; min-width: 0; min-height: 56px; padding: 0 var(--e3); border: 0; background: transparent;
                  font-size: 32px; font-weight: 500; letter-spacing: -.02em; }
.cremades input:focus-visible { outline: none; }
.cremades input::placeholder { color: var(--fil); }
.cremades span { display: grid; place-items: center; padding: 0 var(--e3); border-left: 1px solid var(--fil);
                 font-size: 14px; font-weight: 500; color: var(--tinta-2); }
.compte { font-size: 14px; color: var(--tinta-2); }
.veredicte-linia { padding-top: var(--e3); border-top: 1px solid var(--fil); font-size: 17px; font-weight: 600; line-height: 1.35; }
.veredicte-linia[data-estat="superavit"] { color: var(--ocre); }
.veredicte-linia[data-estat="sense_dades"] { color: var(--tinta-2); font-weight: 500; }

/* --- els dies del període: files de catàleg --- */
.fila {
