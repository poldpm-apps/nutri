<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Les icones de Nutrició, del mateix joc que les de l'app del cos: un sol
       traç fi (1,6), arrodonit i sense farciment. Només hi ha les que l'app fa
       servir; una que en falti la detecta `npm run comprova`. -->

  <!-- Navegar. -->
  <symbol id="ic-esquerra" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
  <symbol id="ic-dreta" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>

  <!-- Afegir i plegar. -->
  <symbol id="ic-mes" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="ic-menys" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>

  <!-- Tancar i treure. -->
  <symbol id="ic-tancar" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>

  <!-- Objectius: la línia de traços del punt de control sobre una carena. -->
  <symbol id="ic-ajust" viewBox="0 0 24 24"><path d="M3 18h18"/><path d="M15 4v16" stroke-dasharray="2 2.5"/><path d="M3 18c4 0 5-6 7-6s3 6 7 6"/></symbol>

  <!-- Els avisos al mòbil. -->
  <symbol id="ic-campana" viewBox="0 0 24 24">
    <path d="M6.5 16v-5a5.5 5.5 0 0 1 11 0v5l1.5 2h-14z"/><path d="M10 21h4"/>
  </symbol>

  <!-- Alguna cosa no va. -->
  <symbol id="ic-avis" viewBox="0 0 24 24"><path d="M12 4 21 19.5H3z"/><path d="M12 10v4M12 16.8v.2"/></symbol>

  <!-- Fet. -->
  <symbol id="ic-fet" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>

  <!-- Sense cobertura. -->
  <symbol id="ic-sense-xarxa" viewBox="0 0 24 24">
    <path d="M5 19v-2M10 19v-6M15 19v-9M20 19V5"/><path d="M4 4l16 16"/>
  </symbol>

  <!-- Genèriques: un estat buit i un apartat sense icona pròpia. -->
  <symbol id="ic-habits" viewBox="0 0 24 24"><path d="M3 18h18"/><path d="M3 18c4 0 5-6 9-6s5 6 9 6"/></symbol>
  <symbol id="ic-modul" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 9h16"/></symbol>

  <!-- L'app: la sigla sobre la línia de base. A 24 px els ecos de la icona
       instal·lada es barregen; aquí n'hi ha prou amb la N. -->
  <symbol id="ic-nutricio" viewBox="0 0 24 24">
    <path d="M3 20.2h18"/>
    <path d="M7 20.2V5.5l10 14.7V5.5"/>
  </symbol>
</svg>
