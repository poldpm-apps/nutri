<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Les icones de Nutrició. Un sol traç, quadrat i sense farciment: el de
       les fletxes d'un recorregut senyalitzat. Només hi ha les que l'app fa
       servir; una que en falti la detecta `npm run comprova`. -->

  <!-- Navegar: fletxes de balisa. -->
  <symbol id="ic-esquerra" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="ic-dreta" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>

  <!-- Afegir i plegar. -->
  <symbol id="ic-mes" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="ic-menys" viewBox="0 0 24 24"><path d="M4 12h16"/></symbol>

  <!-- Tancar i treure. -->
  <symbol id="ic-tancar" viewBox="0 0 24 24"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></symbol>

  <!-- Objectius: el punt de control, la bandera del CP. -->
  <symbol id="ic-ajust" viewBox="0 0 24 24"><path d="M6 21V3"/><path d="M6 4h12l-3.5 4.5L18 13H6"/></symbol>

  <!-- Els avisos al mòbil. -->
  <symbol id="ic-campana" viewBox="0 0 24 24">
    <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/>
  </symbol>

  <!-- Alguna cosa no va: el triangle de perill de la senyalització. -->
  <symbol id="ic-avis" viewBox="0 0 24 24"><path d="M12 3.5L21.5 20h-19z"/><path d="M12 10v4.5M12 17v.5"/></symbol>

  <!-- Fet: el tic de la meta. -->
  <symbol id="ic-fet" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></symbol>

  <!-- Sense cobertura: l'antena amb la ratlla. -->
  <symbol id="ic-sense-xarxa" viewBox="0 0 24 24">
    <path d="M5 19v-2M10 19v-6M15 19v-9M20 19V5"/><path d="M3.5 3.5l17 17"/>
  </symbol>

  <!-- Genèriques: un estat buit i un apartat sense icona pròpia. -->
  <symbol id="ic-habits" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></symbol>
  <symbol id="ic-modul" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 9h16"/></symbol>

  <!-- L'app: la sigla. Una N amb la bandereta del punt de control. -->
  <symbol id="ic-nutricio" viewBox="0 0 24 24">
    <path d="M5 20V4l10 16V4"/><path d="M15 4l6 2.5-6 2.5"/>
  </symbol>
</svg>
