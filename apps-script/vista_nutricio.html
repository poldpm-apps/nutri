<script>
/* NUTRICIÓ — la pantalla
   Món: el dorsal i el full de parcials d'una cursa de muntanya.

   LA DECISIÓ QUE MANA: apuntar un aliment ha de ser el camí més curt de la
   pantalla. Si costa, no s'usa, i un comptador que no s'omple no serveix de
   res. Per això cada àpat té el seu «Afegeix-hi» a la vista i el rebost hi és
   al primer toc: la majoria de dies menges el mateix, i tornar a teclejar
   «pit de pollastre · 165 · 31» és exactament la fricció que fa abandonar
   l'eina.

   EL BALANÇ ÉS EL NÚMERO DEL DORSAL. A sota hi ha el recorregut: la sortida
   és l'equilibri, al mig; el dèficit cap a la dreta, el superàvit cap a
   l'esquerra, i l'objectiu és un punt de control (CP) que es passa. No hi ha
   res que s'ompli: el corredor és a un lloc del recorregut, i prou. */

App.registraVista('nutricio', {
  render: function (arrel, params) {

    var data = params.data || fmt.avui();
    var periode = params.periode || 'dia';
    var apatObert = null;      // quin àpat té el formulari desplegat, si n'hi ha cap
    var dades = null, aliments = [], ajustos = null;

    var APATS = [
      { clau: 'dinar',   nom: 'Dinar',   art: 'al dinar',   de: 'del dinar'   },
      { clau: 'berenar', nom: 'Berenar', art: 'al berenar', de: 'del berenar' },
      { clau: 'sopar',   nom: 'Sopar',   art: 'al sopar',   de: 'del sopar'   }
    ];

    var MENYS = '−';      // el signe menys de debò, no el guionet

    var r0 = function (n) { return Math.round(Number(n) || 0); };
    /* Amb coma, que aquí es parla català: «95,8 g» i no «95.8 g». I sense el
       decimal quan és zero, que «140,0 g» no diu res que no digui «140 g». */
    var r1 = function (n) {
      var v = Math.round((Number(n) || 0) * 10) / 10;
      return (v % 1 === 0 ? String(v) : v.toFixed(1)).replace('.', ',');
    };
    /* Els milers amb punt: «1.670», que és com es llegeix en un dorsal. El
       format del sistema no ho fa per a quatre xifres en català —escriu
       «1670»— i el número de dalt és justament de quatre xifres. */
    var m0 = function (n) {
      return String(Math.abs(r0(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    };
    var num = function (v) {
      var n = parseFloat(String(v === undefined || v === null ? '' : v).replace(',', '.'));
      return isFinite(n) ? n : 0;
    };

    /* «ABC» NO ÉS ZERO.
       `num()` torna 0 per a qualsevol cosa que no sigui un número, i això vol
       dir que escriure malament les calories les apuntava a zero sense dir-ho:
       l'aliment entrava amb un valor que tu no havies triat i el dia quedava
       fals. Aquesta distingeix el buit —que sí que val zero— del que no és cap
       número, que ha de parar l'alta i explicar-ho. */
    var numExacte = function (v) {
      var t = String(v === undefined || v === null ? '' : v).trim().replace(',', '.');
      if (!t) return 0;
      return /^-?\d*\.?\d+$/.test(t) ? parseFloat(t) : null;
    };

    /* I UN ALIMENT NO PESA MIL TONES.
       Sense sostre, un dit de més al teclat numèric feia que l'àpat digués un
       milió de quilocalories i el balanç del dia deixava de voler dir res.
       Els límits són generosos a posta: 5 kg d'un cop, 1.000 kcal per 100 g
       —l'oli en té 884— i 100 g de proteïna per 100 g, que és el màxim que hi
       cap per definició. */
    var SOSTRE = { grams: 5000, kcal100: 1000, prot100: 100 };

    /* El veredicte el redacten el servidor i `verdicteLocal`, i han de dir
       el mateix lletra per lletra —hi ha una prova que ho compara—. Els milers
       s'hi posen en pintar-lo, perquè no digui «1670» sota un dorsal «1.670». */
    function ambMilers(text) {
      return String(text || '').replace(/\d{4,}/g, function (n) { return m0(n); });
    }

    /** Menys davant d'un dèficit: el balanç es llegeix com el pes que perds. */
    function signe(n) { return n > 0 ? MENYS : n < 0 ? '+' : ''; }

    var DIES_CURTS = ['dg', 'dl', 'dt', 'dc', 'dj', 'dv', 'ds'];
    function dataDe(iso) {
      var p = String(iso).split('-');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12);
    }
    function nomDiaCurt(iso) { var d = dataDe(iso); return DIES_CURTS[d.getDay()] + ' ' + d.getDate(); }

    // ------------------------------------------------------------- capçalera

    var PERIODES = [['dia', 'Dia'], ['setmana', 'Setmana'], ['mes', 'Mes']];
    var ANTERIOR = { dia: 'Dia anterior', setmana: 'Setmana anterior', mes: 'Mes anterior' };
    var SEGUENT = { dia: 'Dia següent', setmana: 'Setmana següent', mes: 'Mes següent' };
    var ARA = { dia: 'Avui', setmana: 'Aquesta setmana', mes: 'Aquest mes' };
    var ALTRE = { dia: '', setmana: 'Una altra setmana', mes: 'Un altre mes' };

    /* LA CAPÇALERA DEL CATÀLEG, la mateixa que la del cos: la marca a dalt,
       el títol gran, i a sota el període i el pas d'un dia a l'altre entre
       dues regles. «Torna a avui» només surt quan no hi ets. */
    function capcalera(esAvui) {
      var nomPeriode = (PERIODES.filter(function (p) { return p[0] === periode; })[0] || PERIODES[0])[1];
      var on = esAvui ? ARA[periode] : (periode === 'dia' ? nomDiaCurt(data) : ALTRE[periode]);
      return '<header>' +
          '<div class="cap">' +
            '<span class="marca">' + ic('nutricio') + '<span class="gravat tinta">Nutrició</span></span>' +
            '<button class="btn" type="button" data-ajustos aria-haspopup="dialog">Objectius</button>' +
          '</div>' +
          '<div class="titol"><h1>' + esc(titolPeriode()) + '</h1>' +
            '<p>' + esc(nomPeriode) + (esAvui && periode === 'dia' ? ' · avui' : '') + '</p></div>' +
        '</header>' +
        '<div class="periodes" role="group" aria-label="Què vols veure">' +
          PERIODES.map(function (p) {
            return '<button type="button" data-va="' + p[0] + '" aria-pressed="' +
                   (p[0] === periode ? 'true' : 'false') + '">' + p[1] + '</button>';
          }).join('') +
        '</div>' +
        '<nav class="dies" aria-label="Canvia de ' + esc(nomPeriode.toLowerCase()) + '">' +
          '<button class="fletxa" type="button" data-salt="-1" aria-label="' + ANTERIOR[periode] + '">' +
            ic('esquerra') + '</button>' +
          '<div class="dia-actual" aria-live="polite"><span>' + esc(on) + '</span>' +
            (esAvui ? '' : '<button class="a-avui" type="button" data-anar-avui>Torna a avui</button>') +
          '</div>' +
          '<button class="fletxa" type="button" data-salt="1" aria-label="' + SEGUENT[periode] + '"' +
            (esAvui ? ' disabled' : '') + '>' + ic('dreta') + '</button>' +
        '</nav>';
    }

    function titolPeriode() {
      if (periode === 'dia') return fmt.llarga(data);
      if (!dades || !dades.desde) return '…';
      if (periode === 'mes') {
        var d = new Date(Number(data.slice(0, 4)), Number(data.slice(5, 7)) - 1, 1);
        var m = d.toLocaleDateString('ca-ES', { month: 'long', year: 'numeric' });
        return m.charAt(0).toUpperCase() + m.slice(1);
      }
      return nomDiaCurt(dades.desde) + ' – ' + nomDiaCurt(dades.fins);
    }

    /** El número de catàleg d'un dia: «DIA 280», el dia de l'any. */
    function codiDia(iso) {
      var d = dataDe(iso), inici = new Date(d.getFullYear(), 0, 1, 12);
      return 'DIA ' + ('00' + (Math.round((d - inici) / 864e5) + 1)).slice(-3);
    }
    function diaMesCurt(iso) {
      var d = dataDe(iso);
      return DIES_CURTS[d.getDay()] + ' ' + d.getDate() + ' ' +
        ['gen', 'febr', 'març', 'abr', 'maig', 'juny', 'jul', 'ag', 'set', 'oct', 'nov', 'des'][d.getMonth()];
    }

    /**
     * «AQUEST APARELL NO REP AVISOS.»
     *
     * L'app s'obre directament en aquesta pantalla i no hi ha cap altre lloc
     * on donar el permís: sense això, el recordatori de les 23:45 —«falten les
     * cremades»— no arribaria mai sense dir per què. Només surt mentre el
     * permís no està donat.
     *
     * El permís s'ha de demanar SEMPRE des d'un toc: si no, el navegador el
     * denega ell sol i et quedes sense poder-ho tornar a intentar.
     */
    function cridaAvisos() {
      if (!window.Notificacions || !Notificacions.potSerHi()) return '';
      var p = Notificacions.permis();
      if (p === 'granted') return '';

      /* PETIT, I QUE NO TAPI EL DORSAL. Una línia i el botó, i només mentre
         es pot fer alguna cosa amb un toc. Si l'has denegat, des d'aquí no es
         pot arreglar: l'explicació viu al full d'Objectius, per al dia que la
         necessitis, i no ocupa la pantalla cada matí. */
      if (p === 'denied') return '';
      return '<div class="crida-avisos" role="region" aria-label="Avisos">' +
        '<svg class="ic ic-p" aria-hidden="true"><use href="#ic-campana"/></svg>' +
        '<p>Activa els avisos per rebre el recordatori del vespre.</p>' +
        '<button class="btn btn-primari" type="button" data-avisos>Activa</button>' +
      '</div>';
    }

    function lligaAvisos() {
      var b = arrel.querySelector('[data-avisos]');
      if (!b) return;
      b.addEventListener('click', function () {
        b.dataset.carregant = '1';
        Notificacions.activa()
          .then(function () {
            App.brindis('Avisos activats en aquest aparell');
            var c = arrel.querySelector('.crida-avisos');
            if (c) c.remove();
          })
          .catch(function (err) {
            b.dataset.carregant = '0';
            App.brindis(err.message, 'error');
            var c = arrel.querySelector('.crida-avisos');
            if (c) c.outerHTML = cridaAvisos();   // si l'ha denegat, la crida se'n va
          });
      });
    }

    /** L'estat dels avisos, per al full d'Objectius. */
    function estatAvisos() {
      if (!window.Notificacions || !Notificacions.potSerHi()) {
        return '<p>Aquest navegador no pot rebre avisos.</p>';
      }
      var p = Notificacions.permis();
      if (p === 'granted') return '<p>Aquest aparell rep els avisos.</p>';
      if (p === 'denied') {
        return '<p>Els has denegat en aquest aparell, i el recordatori del vespre no t\'hi pot ' +
          'arribar. Per tornar-hi: si tens l\'app instal·lada, mantén premuda la icona → ' +
          'Informació de l\'app → Notificacions. Al navegador, el cadenat de la barra ' +
          'd\'adreces → Notificacions → Permet.</p>';
      }
      return '<p>Encara no els has activat en aquest aparell.</p>' +
        '<button class="btn btn-ple" type="button" data-avisos-full>Activa els avisos</button>';
    }

    // ------------------------------------------------------------- el pols

    var W = 343;   // l'amplada de dibuix: la mateixa que la del pols del cos

    /** L'escala del recorregut, la de FitFat: ±800 com a mínim, i que hi càpiguen
        sempre el CP i el balanç. */
    function escalaDe(balancos, objectiu) {
      return Math.max(800, objectiu * 1.4, Math.max.apply(null, balancos.map(Math.abs).concat([0])) * 1.15);
    }
    /** On cau un balanç: el mig és l'equilibri, la dreta el dèficit. */
    function xDe(balanc, escala) { return W / 2 + Math.max(-1, Math.min(1, balanc / escala)) * (W / 2 - 6); }

    /** Una carena: plana, amb un pols a `x`. Torna el traç i el tancament per tapar les del darrere. */
    function carena(base, x, alcada, llavor) {
      var pts = [], s = llavor * 9301 + 49297;
      function atzar() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
      for (var i = 0; i <= W; i += 3) {
        var g = (i - x) / 9;
        var h = x === null ? 0 : alcada * Math.exp(-g * g);
        h += (atzar() - .5) * (x === null ? 0 : 1.2);
        pts.push(i + ' ' + (base - Math.max(0, h)).toFixed(1));
      }
      var linia = 'M' + pts.join('L');
      return { linia: linia, tapa: linia + 'L' + W + ' ' + (base + 14) + 'L0 ' + (base + 14) + 'Z' };
    }

    function rampa(t) {   // del clar al fosc de la rampa, t entre 0 i 1
      var R = [[0xbc, 0xce, 0xd4], [0x7a, 0xb5, 0xc1], [0x1c, 0x84, 0x96]];
      var u = Math.max(0, Math.min(1, t)) * (R.length - 1), a = Math.min(Math.floor(u), R.length - 2), f = u - a;
      return 'rgb(' + R[a].map(function (v, k) { return Math.round(v + (R[a + 1][k] - v) * f); }).join(',') + ')';
    }

    /**
     * EL POLS DEL DIA. Una carena plana amb un pols a la posició del balanç:
     * l'equilibri al mig, el dèficit a la dreta, i el punt de control —
     * l'objectiu— en traços. No hi ha res que s'ompli: el pols és a un lloc.
     */
    function polsDia(balanc, objectiu) {
      var te = balanc !== null && balanc !== undefined;
      var H = 112, base = 86, escala = escalaDe(te ? [balanc] : [], objectiu);
      var x = te ? xDe(balanc, escala) : null;
      var cp = objectiu > 0 ? xDe(objectiu, escala) : null;
      var c = carena(base, x, 50, 7);
      var etiqueta = te ? signe(balanc) + m0(balanc) : '';
      var ancora = x === null ? 'middle' : x > W - 40 ? 'end' : x < 40 ? 'start' : 'middle';

      var diu = !te ? 'Encara sense balanç: falten les calories cremades.'
        : 'El pols del balanç, amb l\'equilibri al mig: ' +
          (balanc > 0 ? 'dèficit de ' : balanc < 0 ? 'superàvit de ' : 'equilibri, ') +
          (balanc !== 0 ? m0(balanc) + ' kcal' : '') +
          (objectiu > 0 ? (balanc >= objectiu ? ', passat el punt de control de ' : ', abans del punt de control de ') +
            MENYS + m0(objectiu) : '') + '.';

      return '<svg class="pols" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(diu) + '">' +
        (cp !== null ? '<path class="cp" d="M' + cp.toFixed(1) + ' 14V' + (base + 8) + '"/>' +
          '<text x="' + cp.toFixed(1) + '" y="10" text-anchor="' + (cp > W - 60 ? 'end' : 'middle') + '" class="suau">CP ' +
          MENYS + m0(objectiu) + '</text>' : '') +
        '<path class="zero" d="M' + (W / 2) + ' ' + (base + 2) + 'V' + (base + 10) + '"/>' +
        '<text x="' + (W / 2) + '" y="' + (base + 24) + '" text-anchor="middle" class="suau">0</text>' +
        (te
          ? '<path class="r" d="' + c.linia + '" stroke="#054a57" stroke-width="1.6"/>' +
            '<text x="' + x.toFixed(1) + '" y="' + (base - 58) + '" text-anchor="' + ancora + '">' + etiqueta + '</text>'
          : '<path class="r" d="M0 ' + base + 'H' + W + '" stroke="#7ab5c1" stroke-width="1" stroke-dasharray="2 4"/>') +
      '</svg>' +
      '<div class="pols-llegenda" aria-hidden="true"><span class="gravat">← Superàvit</span><span class="gravat">Dèficit →</span></div>';
    }

    /**
     * EL POLS DEL PERÍODE: una carena per dia, apilades. La més vella al fons,
     * clara; la d'avui davant, fosca. El CP és una sola línia de traços que les
     * travessa totes. Un dia sense balanç és una línia de punts plana.
     */
    function polsPeriode(d, objectiu) {
      var dies = d.dies, n = dies.length;
      var nets = dies.filter(function (x) { return x.net !== null; }).map(function (x) { return x.net; });
      var escala = escalaDe(nets, objectiu);
      var pas = n <= 7 ? 14 : 5.4, alt = n <= 7 ? 40 : 30, dalt = alt + 14;
      var H = dalt + (n - 1) * pas + 30;
      var cp = objectiu > 0 ? xDe(objectiu, escala) : null;
      var traces = '';
      dies.forEach(function (x, i) {
        var base = dalt + i * pas, davant = i === n - 1;
        if (x.net === null) {
          traces += '<path class="r" d="M0 ' + base + 'H' + W + '" stroke="#bcced4" stroke-width="1" stroke-dasharray="2 4"/>';
          return;
        }
        var h = Math.max(8, Math.min(1, Math.abs(x.net) / escala) * alt);
        var c = carena(base, xDe(x.net, escala), h, i + 3);
        traces += '<path class="f" d="' + c.tapa + '"/>' +
          '<path class="r" d="' + c.linia + '" stroke="' + (davant ? '#054a57' : rampa(i / Math.max(1, n - 2))) +
          '" stroke-width="' + (davant ? 1.6 : 1) + '"/>';
      });
      var baix = dalt + (n - 1) * pas;
      return '<svg class="pols" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' +
          esc('Una carena per dia, la més recent davant. El pols de cada una és a la posició del seu balanç, ' +
              'amb l\'equilibri al mig i el dèficit a la dreta' +
              (objectiu > 0 ? '; la línia de traços és l\'objectiu, ' + MENYS + m0(objectiu) : '') + '.') + '">' +
        traces +
        (cp !== null ? '<path class="cp" d="M' + cp.toFixed(1) + ' 12V' + (baix + 8) + '"/>' +
          '<text x="' + cp.toFixed(1) + '" y="8" text-anchor="' + (cp > W - 60 ? 'end' : 'middle') + '" class="suau">CP ' +
          MENYS + m0(objectiu) + '</text>' : '') +
        '<path class="zero" d="M' + (W / 2) + ' ' + (baix + 2) + 'V' + (baix + 10) + '"/>' +
        '<text x="' + (W / 2) + '" y="' + (baix + 24) + '" text-anchor="middle" class="suau">0</text>' +
      '</svg>' +
      '<div class="pols-llegenda" aria-hidden="true"><span class="gravat">← Superàvit</span><span class="gravat">Dèficit →</span></div>';
    }

    function xifra(etiqueta, valor, unitat, detall, marca) {
      return '<div class="xifra"><p class="gravat">' + esc(etiqueta) + '</p>' +
        '<p class="gran"><span class="n">' + valor + '</span>' + (unitat ? '<span class="u">' + esc(unitat) + '</span>' : '') + '</p>' +
        (detall ? '<p class="d"' + (marca ? ' data-' + marca : '') + '>' + esc(detall) + '</p>' : '') + '</div>';
    }

    function xifraProteina(etiqueta, proteina, objectiu) {
      if (!(objectiu > 0)) return xifra(etiqueta, r1(proteina), 'g');
      var falta = objectiu - proteina;
      return xifra(etiqueta, r1(proteina), 'g',
        falta > 0 ? 'falten ' + r1(falta) + ' de ' + r0(objectiu) : 'objectiu de ' + r0(objectiu) + ' assolit',
        falta > 0 ? '' : 'fet');
    }

    var PARAULA = {
      deficit_assolit: 'Objectiu assolit', deficit: 'En dèficit', superavit: 'En superàvit',
      equilibri: 'En equilibri'
    };

    // ------------------------------------------------------------ vista dia

    /* L'ordre és el de FitFat, i és el bo: el balanç a dalt de tot perquè és
       el que mires primer, després els àpats que és on treballes, i el
       tancament al final perquè és l'última cosa que fas del dia. A
       l'ordinador, el pols a l'esquerra i el full a la dreta. */
    function pintaDia(d, dEnCau) {
      dades = d;
      arrel.innerHTML = '<div class="envoltori">' +
        capcalera(d.data >= fmt.avui()) +
        cridaAvisos() +
        '<div class="curs">' +
          '<div class="columna" id="col-dalt">' + blocDalt(d) + '</div>' +
          '<div class="columna">' +
            '<section class="sec" aria-labelledby="t-apats">' +
              '<div class="sec-cap"><h2 id="t-apats">Àpats</h2><span class="gravat">' + esc(diaMesCurt(d.data)) + '</span></div>' +
              '<div id="col-apats">' +
                APATS.map(function (m, i) { return blocApat(d, m, i); }).join('') +
              '</div>' +
            '</section>' +
            '<section class="sec" id="col-tanca" aria-labelledby="t-tanca">' + blocTanca(d) + '</section>' +
          '</div>' +
        '</div>' +
        (dEnCau ? '<p class="menut" style="padding:var(--e4) var(--gutter) 0">Última còpia desada al telèfon.</p>' : '') +
      '</div>';

      lligaCapcalera();
      lligaBalanc();
      lligaApats();
      lligaAvisos();
    }

    /** El veredicte, el pols i les quatre xifres del dia. */
    function blocDalt(d) {
      var t = d.totals, obj = d.objectius.deficit || 0;
      var estat = d.verdicte.estat;
      var paraula = d.teCremades ? (PARAULA[estat] || d.verdicte.text)
                  : (t.ingerides > 0 ? 'Falten les cremades' : 'Encara no hi ha res');
      var apats = d.apats.filter(function (a) { return a.items && a.items.length; }).length;

      return '<section class="veredicte" aria-labelledby="v-text">' +
          '<p class="gravat"><span class="num-cat">' + codiDia(d.data) + '</span> · ' + esc(diaMesCurt(d.data)) +
            (d.data === fmt.avui() ? ' · avui' : '') + '</p>' +
          '<p class="v" id="v-text" data-estat="' + esc(estat) + '">' + esc(paraula) + '</p>' +
          polsDia(d.teCremades ? d.net : null, obj) +
        '</section>' +
        '<section class="xifres" aria-label="Les quatre xifres del dia">' +
          xifra('Balanç', d.teCremades ? signe(d.net) + m0(d.net) : '—', d.teCremades ? 'kcal' : '',
                obj > 0 ? 'objectiu ' + MENYS + m0(obj) : '', d.teCremades && d.net < 0 ? 'avis' : '') +
          xifra('Ingerides', m0(t.ingerides), 'kcal',
                apats === 0 ? 'res apuntat' : apats === 1 ? '1 àpat' : apats + ' àpats') +
          xifraProteina('Proteïna', t.proteina, d.objectius.proteina) +
          xifra('Cremades', d.teCremades ? m0(d.cremades) : '—', d.teCremades ? 'kcal' : '',
                d.teCremades ? 'del rellotge' : 'falten') +
        '</section>';
    }

    /** El tancament: el que has cremat, i què en surt. */
    function blocTanca(d) {
      var compte = d.teCremades
        ? m0(d.cremades) + ' cremades ' + MENYS + ' ' + m0(d.totals.ingerides) + ' ingerides → ' +
          signe(d.net) + m0(d.net) + ' kcal (' + (d.net > 0 ? 'dèficit' : d.net < 0 ? 'superàvit' : 'equilibri') + ')'
        : m0(d.totals.ingerides) + ' kcal ingerides · falten les cremades';

      return '<div class="sec-cap"><h2 id="t-tanca">Tancament</h2><span class="gravat">la meta del dia</span></div>' +
        '<div class="meta-cos">' +
          '<label class="camp" for="n-activitat"><span>Calories cremades · total del dia, del rellotge</span></label>' +
          '<div class="cremades">' +
            '<input id="n-activitat" inputmode="numeric" autocomplete="off" enterkeyhint="done" value="' +
              (d.teActivitat ? esc(String(d.activitat)) : '') + '" placeholder="2400">' +
            '<span aria-hidden="true">kcal</span>' +
          '</div>' +
          '<p class="compte">' + esc(compte) + '</p>' +
          '<p class="veredicte-linia" data-estat="' + esc(d.verdicte.estat) + '" role="status">' +
            esc(ambMilers(d.verdicte.text)) + '</p>' +
        '</div>';
    }

    function blocApat(d, m, idx) {
      var apat = null;
      for (var i = 0; i < d.apats.length; i++) if (d.apats[i].clau === m.clau) apat = d.apats[i];
      if (!apat) apat = { items: [], kcal: 0, proteina: 0 };
      var obert = apatObert === m.clau;
      var idForm = 'form-' + m.clau;

      return '<section class="apat" data-apat="' + esc(m.clau) + '" aria-labelledby="t-' + m.clau + '">' +
        '<div class="apat-cap">' +
          '<h3 id="t-' + m.clau + '"><span class="gravat" aria-hidden="true"><span class="num-cat">P' + (idx + 1) + '</span></span>' +
            esc(m.nom) + '</h3>' +
          '<p class="apat-tot"' + (apat.items.length ? '' : ' data-buit') + '>' +
            (apat.items.length ? m0(apat.kcal) + ' kcal · ' + r1(apat.proteina) + ' g' : 'buit') + '</p>' +
        '</div>' +

        (apat.items.length
          ? '<ul>' + apat.items.map(function (i) {
              return '<li class="ingesta">' +
                '<div><p class="ingesta-nom">' + esc(i.nom) + '</p>' +
                  '<p class="ingesta-espec"><span>' + r0(i.grams) + ' g</span><span>' + r0(i.kcal100) +
                  ' kcal/100</span><span>' + r1(i.prot100) + ' prot/100</span></p></div>' +
                '<p class="ingesta-surt">' + m0(i.kcal) + '<span class="ku">kcal</span>' +
                  '<span class="p">' + r1(i.prot) + ' g</span></p>' +
                '<button class="treu" type="button" data-treu="' + esc(i.id) + '" data-quin="' + esc(i.nom) +
                  '" aria-label="Treu ' + esc(i.nom) + ' ' + esc(m.de) + '">' + ic('tancar', 'ic-p') + '</button>' +
              '</li>';
            }).join('') + '</ul>'
          : '<p class="apat-buit">Encara no hi has apuntat res.</p>') +

        /* EL FORMULARI VE PLEGAT, I NOMÉS N'HI HA UN D'OBERT.
           Els tres àpats amb el formulari desplegat feien la pàgina molt
           llarga: per veure el tancament del dia havies de passar per sobre de
           tres formularis buits. Obrir-ne un tanca l'altre. */
        '<button class="btn btn-ple obre-form" type="button" data-obre-form="' + esc(m.clau) + '"' +
          ' aria-expanded="' + (obert ? 'true' : 'false') + '" aria-controls="' + idForm + '">' +
          ic('mes', 'ic-p') + 'Afegeix-hi<span class="nomes-lectors"> ' + esc(m.art) + '</span></button>' +

        '<div class="inscripcio" id="' + idForm + '"' + (obert ? '' : ' hidden') + '>' +
          '<div class="inscripcio-franja"><span>Afegeix ' + esc(m.art) + '</span>' +
            '<button type="button" data-tanca-form>Tanca</button></div>' +
          '<div class="inscripcio-cos">' +
            /* Llista pròpia i no un <select>: el desplegable natiu d'Android
               dibuixa cada opció amb l'estil del sistema i no admet dues mides
               de lletra a la mateixa línia. */
            '<button class="btn btn-ple tria" type="button" data-guardats aria-haspopup="dialog">Tria un aliment guardat' +
              ic('dreta', 'ic-p') + '</button>' +
            '<label for="' + idForm + '-nom"><span>Aliment</span></label>' +
            '<input id="' + idForm + '-nom" data-nom name="aliment" autocomplete="off" enterkeyhint="next"' +
              ' placeholder="p. ex. plàtan…" aria-describedby="' + idForm + '-mal">' +
            '<div class="trio">' +
              '<div><label for="' + idForm + '-g"><span>Grams</span></label>' +
                '<input id="' + idForm + '-g" data-grams name="grams" inputmode="decimal" class="num" autocomplete="off"' +
                ' aria-describedby="' + idForm + '-mal"></div>' +
              '<div><label for="' + idForm + '-k"><span>kcal/100 g</span></label>' +
                '<input id="' + idForm + '-k" data-kcal name="kcal100" inputmode="decimal" class="num" autocomplete="off"' +
                ' aria-describedby="' + idForm + '-mal"></div>' +
              '<div><label for="' + idForm + '-p"><span>prot/100 g</span></label>' +
                '<input id="' + idForm + '-p" data-prot name="prot100" inputmode="decimal" class="num" autocomplete="off"' +
                ' aria-describedby="' + idForm + '-mal"></div>' +
            '</div>' +
            '<p class="camp-mal" id="' + idForm + '-mal" data-mal role="alert" hidden></p>' +
            '<div class="inscripcio-accions">' +
              '<button class="btn btn-primari" type="button" data-afegeix>Afegeix</button>' +
              '<button class="btn" type="button" data-desa-aliment>Desa l\'aliment al rebost</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</section>';
    }

    /**
     * Obrir el formulari d'un àpat en tanca qualsevol altre.
     *
     * Es fa tocant el DOM i no repintant la pàgina: repintar-la enmig d'un
     * toc et tanca el teclat i et fa perdre el que estiguessis escrivint a
     * l'altre àpat.
     */
    function obreForm(clau) {
      apatObert = (apatObert === clau) ? null : clau;
      arrel.querySelectorAll('.apat').forEach(function (sec) {
        var obert = sec.dataset.apat === apatObert;
        var f = sec.querySelector('.inscripcio');
        var b = sec.querySelector('[data-obre-form]');
        if (f) f.hidden = !obert;
        if (b) b.setAttribute('aria-expanded', obert ? 'true' : 'false');
      });
      if (apatObert) enfocaCamp(apatObert);
    }

    function enfocaCamp(clau) {
      var camp = arrel.querySelector('.apat[data-apat="' + clau + '"] [data-nom]');
      if (camp) { try { camp.focus(); } catch (e) {} }
    }

    // -------------------------------------------------------- setmana i mes

    var totsElsDies = false;   // al mes, la llista ensenya els set últims fins que en demanes més

    /* EL PERÍODE: les carenes apilades a dalt, i a sota la llista dels dies
       com els controls del cos —número de catàleg, veredicte i xifra—. Tocar un
       dia hi va, també el que no té balanç: el dia «sense cremades» és
       justament el que obres per entrar-les. */
    function pintaPeriode(d) {
      dades = d;
      var obj = d.objectius.deficit || 0;
      var enDeficit = d.dies.filter(function (x) { return x.net !== null && x.net > 0; }).length;
      var enSuperavit = d.dies.filter(function (x) { return x.net !== null && x.net < 0; }).length;
      var nomP = periode === 'setmana' ? 'la setmana' : 'el mes';

      arrel.innerHTML = '<div class="envoltori">' +
        capcalera(!d.fins || d.fins >= fmt.avui()) +
        '<div class="curs">' +
          '<div class="columna">' +
            '<section class="veredicte" aria-labelledby="v-text">' +
              '<p class="gravat"><span class="num-cat">' + (periode === 'setmana' ? 'SETMANA' : 'MES') + '</span>' +
                (d.desde ? ' · ' + esc(diaMesCurt(d.desde)) + ' → ' + esc(diaMesCurt(d.fins)) : '') + '</p>' +
              '<p class="v" id="v-text"' + (d.diesAmbBalanc && d.mitjanaNet < 0 ? ' data-estat="superavit"'
                : !d.diesAmbBalanc ? ' data-estat="sense_dades"' : '') + '>' +
                (d.diesAmbBalanc ? signe(d.mitjanaNet) + m0(d.mitjanaNet) + ' kcal/dia' : 'Cap dia amb balanç') + '</p>' +
              (d.diesApuntats === 0
                ? '<p class="menut" style="margin-top:var(--e3)">Encara no hi ha res apuntat en ' + nomP + '.</p>'
                : polsPeriode(d, obj)) +
            '</section>' +
            '<section class="xifres" aria-label="Les xifres del període">' +
              xifra('Ingerides / dia', m0(d.mitjanaIngerides), 'kcal') +
              xifraProteina('Proteïna / dia', d.mitjanaProteina, d.objectius.proteina) +
              xifra('Dies apuntats', String(d.diesApuntats), 'de ' + d.dies.length,
                    enDeficit + ' en dèficit · ' + enSuperavit + ' en superàvit') +
              xifra('Acumulat', d.diesAmbBalanc ? signe(d.netAcumulat) + m0(d.netAcumulat) : '—',
                    d.diesAmbBalanc ? 'kcal' : '', d.diesAmbBalanc ? 'balanç del període' : '',
                    d.diesAmbBalanc && d.netAcumulat < 0 ? 'avis' : '') +
            '</section>' +
          '</div>' +
          '<div class="columna">' +
            '<section class="sec" aria-labelledby="t-dies">' +
              '<div class="sec-cap"><h2 id="t-dies">Dies</h2><span class="gravat">toca\'n un per obrir-lo</span></div>' +
              llistaDies(d, obj) +
            '</section>' +
          '</div>' +
        '</div>' +
      '</div>';

      lligaCapcalera();
      arrel.querySelectorAll('[data-dia]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.ves('nutricio', { data: b.dataset.dia, periode: 'dia' });
        });
      });
      var bt = arrel.querySelector('[data-tots]');
      if (bt) bt.addEventListener('click', function () { totsElsDies = !totsElsDies; pintaPeriode(d); });
    }

    /** La llista de dies, del més recent al més vell. */
    function llistaDies(d, obj) {
      var avui = fmt.avui(), dies = d.dies.slice().reverse();
      var limit = periode === 'mes' && !totsElsDies ? 7 : dies.length;
      var html = '<ol>' + dies.slice(0, limit).map(function (x) {
        var deficit = x.net !== null && x.net > 0;
        var paraula = x.net === null ? (x.apuntat ? 'Sense cremades' : 'Sense dades')
                    : !deficit ? (x.net === 0 ? 'En equilibri' : 'En superàvit')
                    : obj > 0 && x.net >= obj ? 'Objectiu assolit' : 'En dèficit';
        var marca = x.net === null ? ' data-buit' : x.net < 0 ? ' data-avis' : '';
        var diu = fmt.llarga(x.data) + ': ' + paraula.toLowerCase() +
          (x.net !== null && x.net !== 0 ? ', ' + m0(x.net) + ' kcal' : '') + '. Obre el dia';
        return '<li><button class="fila" type="button" data-dia="' + esc(x.data) + '" aria-label="' + esc(diu) + '"' +
            (x.data === avui ? ' aria-current="true"' : '') + '>' +
          '<span class="cat">' + codiDia(x.data) + '<b>' + esc(nomDiaCurt(x.data)) + (x.data === avui ? ' · avui' : '') + '</b></span>' +
          '<span class="fila-v"' + marca + '>' + paraula + '</span>' +
          '<span class="val">' + (x.net === null ? '—' : signe(x.net) + m0(x.net)) + '</span>' +
        '</button></li>';
      }).join('') + '</ol>';
      if (periode === 'mes' && dies.length > 7) {
        html += '<div class="tots"><button class="btn" type="button" data-tots aria-expanded="' + totsElsDies + '">' +
          (totsElsDies ? 'Només els set últims' : 'Tots els dies · ' + dies.length) + '</button></div>';
      }
      return html;
    }

    // -------------------------------------------------------------- accions

    function lligaCapcalera() {
      arrel.querySelectorAll('[data-salt]').forEach(function (b) {
        b.addEventListener('click', function () {
          var n = Number(b.dataset.salt);
          var nova = periode === 'dia' ? fmt.suma(data, n)
                   : periode === 'setmana' ? fmt.suma(data, n * 7)
                   : mouMes(data, n);
          if (nova > fmt.avui()) nova = fmt.avui();   // al futur no hi ha res a mirar
          if (nova === data) return;
          App.ves('nutricio', { data: nova, periode: periode });
        });
      });

      arrel.querySelectorAll('[data-va]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (b.dataset.va === periode) return;
          App.ves('nutricio', { data: data, periode: b.dataset.va });
        });
      });

      var ba = arrel.querySelector('[data-anar-avui]');
      if (ba) ba.addEventListener('click', function () {
        App.ves('nutricio', { data: fmt.avui(), periode: periode });
      });

      var baj = arrel.querySelector('[data-ajustos]');
      if (baj) baj.addEventListener('click', obreAjustos);
    }

    function mouMes(iso, n) {
      var y = Number(iso.slice(0, 4)), m = Number(iso.slice(5, 7)) - 1 + n;
      var d = new Date(y, m, 1);
      var ultim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      var dia = Math.min(Number(iso.slice(8, 10)), ultim);
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + dia).slice(-2);
    }

    /**
     * EL VERDICTE DEL DIA, CALCULAT AQUÍ.
     *
     * TÉ UNA BESSONA al servidor —`verdicte_` a 40_Mod_Nutricio.gs— i han de
     * dir exactament el mateix; hi ha una prova que ho comprova cas per cas.
     *
     * Per què es duplica, havent-hi una regla al servidor: perquè posar les
     * calories cremades i esperar dos segons per saber si estàs en dèficit és
     * esperar un càlcul que ja pots fer. Les dues xifres —el que has menjat i
     * el que has cremat— són totes dues aquí; la resta és una resta.
     */
    function verdicteLocal(teCremades, net, objectiu) {
      if (!teCremades) {
        return { estat: 'sense_dades', text: 'Introdueix les calories cremades per tancar el dia.' };
      }
      if (net > 0 && objectiu > 0 && net >= objectiu) {
        return { estat: 'deficit_assolit', text: 'Dèficit de ' + Math.round(net) + ' kcal — objectiu assolit' };
      }
      if (net > 0) {
        return {
          estat: 'deficit',
          text: objectiu > 0
            ? 'En dèficit de ' + Math.round(net) + ' kcal · falten ' + Math.round(objectiu - net) + ' per l\'objectiu'
            : 'En dèficit de ' + Math.round(net) + ' kcal'
        };
      }
      if (net === 0) {
        return { estat: 'equilibri', text: 'En equilibri: has cremat el mateix que has ingerit.' };
      }
      return {
        estat: 'superavit',
        text: 'En superàvit de ' + Math.round(-net) + ' kcal · avui has menjat més del que has cremat'
      };
    }

    function lligaBalanc() {
      var inp = arrel.querySelector('#n-activitat');
      if (!inp) return;
      var previ = inp.value;
      inp.addEventListener('change', function () {
        if (inp.value === previ) return;
        previ = inp.value;
        var kcal = num(inp.value);

        /* PRIMER ES VEU, DESPRÉS ES DESA. La xifra és teva i el càlcul també:
           no hi ha cap motiu per mirar dos segons una pantalla que ja sap la
           resposta. Si el servidor diu una altra cosa, mana ell i es repinta;
           si falla, es desfà. */
        if (dades && dades.totals) {
          dades.activitat = kcal;
          dades.teActivitat = kcal > 0;
          dades.cremades = kcal;
          dades.teCremades = kcal > 0;
          dades.net = kcal > 0 ? kcal - dades.totals.ingerides : null;
          dades.verdicte = verdicteLocal(dades.teCremades, dades.net,
                                         (dades.objectius || {}).deficit || 0);
          /* ELS DOS BLOCS, no només el de dalt. El dorsal és a dalt i el
             veredicte a baix, amb el camp que acabes d'omplir: repintant
             només un, el número canviava i el «estàs en dèficit» es quedava
             com estava, que és pitjor que no tocar res. */
          var dalt = arrel.querySelector('#col-dalt');
          if (dalt) dalt.innerHTML = blocDalt(dades);
          var tanca = arrel.querySelector('#col-tanca');
          if (tanca) {
            tanca.innerHTML = blocTanca(dades);
            /* El camp s'ha tornat a pintar: torna-hi el que hi havies escrit. */
            var nou = arrel.querySelector('#n-activitat');
            if (nou) { nou.value = inp.value; }
            lligaBalanc();
          }
        }

        escriu('nutricio', 'activitat', { data: data, kcal: kcal }, quePinto())
          .then(function (r) { Cau.oblida('nutricio.'); aplica(r); })
          .catch(function (err) {
            App.brindis(err.message, 'error');
            carrega();          // el que hi ha pintat era una promesa; se'n va
          });
      });
    }

    /**
     * EL REBOST: la llista d'aliments guardats.
     *
     * El nom mana i les xifres van petites i grises: el que busques és
     * «tonyina», no «185». Amb tot de la mateixa mida, cada aliment és una
     * frase que s'ha de llegir sencera per descartar-la.
     */
    function obreAliments(alTriar) {
      if (!aliments.length) {
        App.brindis('Encara no tens cap aliment al rebost. Escriu-ne un i prem «Desa l\'aliment al rebost».', 'error');
        return;
      }

      var cos = App.modal('Rebost',
        '<label class="camp"><span>Cerca un aliment guardat</span>' +
          '<input class="entrada" data-cerca type="search" autocomplete="off" enterkeyhint="search" placeholder="Tonyina…"></label>' +
        '<p class="menut" style="margin-top:var(--e2)">Valors per 100 g</p>' +
        '<div class="rebost-llista" id="llista-aliments"></div>');

      var llista = cos.querySelector('#llista-aliments');
      var cerca = cos.querySelector('[data-cerca]');

      function pinta(q) {
        var n = String(q || '').trim().toLowerCase();
        var mostrats = aliments.filter(function (a) {
          return !n || String(a.nom).toLowerCase().indexOf(n) !== -1;
        });
        llista.innerHTML = mostrats.length
          ? mostrats.map(function (a) {
              return '<button class="aliment-fila" type="button" data-a="' + esc(a.id) + '">' +
                '<span class="aliment-nom">' + esc(a.nom) + '</span>' +
                '<span class="aliment-dades">' + m0(a.kcal100) + ' kcal · ' + r1(a.prot100) + ' g prot</span>' +
              '</button>';
            }).join('')
          : '<p class="rebost-buit">Cap aliment amb aquest nom. Escriu-lo al formulari i desa\'l al rebost.</p>';

        llista.querySelectorAll('[data-a]').forEach(function (b) {
          b.addEventListener('click', function () {
            var t = null;
            for (var i = 0; i < aliments.length; i++) {
              if (aliments[i].id === b.dataset.a) t = aliments[i];
            }
            App.tancaModal();
            if (t) alTriar(t);
          });
        });
      }

      pinta('');
      cerca.addEventListener('input', function () { pinta(cerca.value); });
    }

    function lligaApats() {
      arrel.querySelectorAll('[data-obre-form]').forEach(function (b) {
        b.addEventListener('click', function () { obreForm(b.dataset.obreForm); });
      });

      arrel.querySelectorAll('.apat').forEach(function (sec) {
        var apat = sec.dataset.apat;
        var sel  = sec.querySelector('[data-guardats]');
        var nom  = sec.querySelector('[data-nom]');
        var gr   = sec.querySelector('[data-grams]');
        var kc   = sec.querySelector('[data-kcal]');
        var pr   = sec.querySelector('[data-prot]');
        var bt   = sec.querySelector('[data-afegeix]');
        var bd   = sec.querySelector('[data-desa-aliment]');
        var mal  = sec.querySelector('[data-mal]');
        var tf   = sec.querySelector('[data-tanca-form]');

        tf.addEventListener('click', function () {
          obreForm(apat);
          var b = sec.querySelector('[data-obre-form]');
          if (b) { try { b.focus(); } catch (e) {} }
        });

        sel.addEventListener('click', function () { obreAliments(function (a) {
          nom.value = a.nom; kc.value = r1(a.kcal100); pr.value = r1(a.prot100);
          refresca(); desaEsborrany(); gr.focus();
        }); });

        function llest() { return nom.value.trim() && num(gr.value) > 0; }

        // El botó ensenya el resultat abans de prémer-lo. Així no cal afegir
        // per veure si t'has equivocat de coma.
        function refresca() {
          if (llest()) {
            bt.textContent = 'Afegeix · ' + m0(num(gr.value) * num(kc.value) / 100) + ' kcal · ' +
                             r1(num(gr.value) * num(pr.value) / 100) + ' g';
          } else {
            bt.textContent = 'Afegeix';
          }
        }

        /* EL QUE ESTAVES ESCRIVINT NO POT DEPENDRE DE NO TOCAR RES.
           Si recarregaves —o el mòbil et tancava la pestanya— entre prémer
           «Afegeix» i la resposta del servidor, l'aliment se n'anava sense
           deixar rastre. Aquí no es pot fer com amb la cua i reenviar-ho a
           cegues: afegiria el mateix plat dues vegades. El que sí que es pot
           desar sense risc és el formulari a mig omplir, i tornar-te'l a
           deixar tal com estava perquè només l'hagis de confirmar. */
        var clauEsborrany = 'nutricio.esborrany';

        function desaEsborrany() {
          var buit = !nom.value.trim() && !gr.value.trim() && !kc.value.trim() && !pr.value.trim();
          if (buit) { Cau.treu(clauEsborrany); return; }
          Cau.set(clauEsborrany, { data: data, apat: apat, nom: nom.value,
                                   gr: gr.value, kc: kc.value, pr: pr.value });
        }

        (function recuperaEsborrany() {
          var e = Cau.get(clauEsborrany, null);
          if (!e || e.data !== data || e.apat !== apat) return;
          if (nom.value.trim() || gr.value.trim()) return;   // no trepitgis res escrit ara
          nom.value = e.nom || ''; gr.value = e.gr || '';
          kc.value = e.kc || ''; pr.value = e.pr || '';
          refresca();
        })();

        function netejaMal() {
          mal.hidden = true; mal.textContent = '';
          [nom, gr, kc, pr].forEach(function (i) { i.removeAttribute('aria-invalid'); });
        }
        function diguesMal(text, camp) {
          mal.textContent = text; mal.hidden = false;
          if (camp) { camp.setAttribute('aria-invalid', 'true'); try { camp.focus(); } catch (e) {} }
        }

        [nom, gr, kc, pr].forEach(function (i) {
          i.addEventListener('input', function () { refresca(); desaEsborrany(); if (!mal.hidden) netejaMal(); });
        });
        /* RETORN VA AL CAMP SEGÜENT, i només afegeix des de l'últim. El
           teclat del mòbil hi posa «següent»: afegir des del nom era ensenyar
           un error vermell a mig escriure. */
        var ordre = [nom, gr, kc, pr];
        ordre.forEach(function (i, n) {
          i.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            if (n < ordre.length - 1) { try { ordre[n + 1].focus(); } catch (er) {} }
            else afegeix();
          });
        });
        pr.setAttribute('enterkeyhint', 'done');
        [gr, kc].forEach(function (i) { i.setAttribute('enterkeyhint', 'next'); });

        /* QUÈ HI HA MALAMENT, DIT AMB PARAULES I AL COSTAT DEL CAMP.
           Prémer «Afegeix» amb el formulari a mitges no podia no fer res, i
           els valors impossibles no podien passar: calories negatives,
           proteïna amb lletres convertida en zero, i grams sense sostre. */
        function problema() {
          if (!nom.value.trim()) return { text: 'Posa-hi el nom de l\'aliment.', camp: nom };
          var g = numExacte(gr.value);
          if (g === null) return { text: 'Els grams han de ser un número.', camp: gr };
          if (g <= 0) return { text: 'Posa-hi quants grams n\'has menjat.', camp: gr };
          if (g > SOSTRE.grams) return { text: 'Cinc quilos d\'un cop? Mira els grams.', camp: gr };
          var k = numExacte(kc.value);
          if (k === null) return { text: 'Les calories han de ser un número.', camp: kc };
          if (k < 0) return { text: 'Les calories no poden ser negatives.', camp: kc };
          if (k > SOSTRE.kcal100) return { text: 'Cap aliment passa de 1.000 kcal per 100 g.', camp: kc };
          var pt = numExacte(pr.value);
          if (pt === null) return { text: 'La proteïna ha de ser un número.', camp: pr };
          if (pt < 0) return { text: 'La proteïna no pot ser negativa.', camp: pr };
          if (pt > SOSTRE.prot100) return { text: 'No hi caben més de 100 g de proteïna en 100 g.', camp: pr };
          return null;
        }

        function afegeix() {
          var p = problema();
          if (p) { diguesMal(p.text, p.camp); return; }
          netejaMal();
          bt.disabled = true;
          bt.dataset.carregant = '1';
          escriu('nutricio', 'afegeix', {
            data: data, apat: apat, nom: nom.value.trim(),
            grams: num(gr.value), kcal100: num(kc.value), prot100: num(pr.value)
          }, quePinto()).then(function (r) {
            var quin = nom.value.trim();
            nom.value = gr.value = kc.value = pr.value = '';
            Cau.treu(clauEsborrany);
            bt.disabled = false;
            bt.dataset.carregant = '0';
            /* El botó torna a dir «Afegeix». Si no, es queda amb la previsió
               del que acabes d'apuntar i sembla que encara ho hagis de prémer. */
            refresca();
            /* Només després d'un toc de debò: sense, el navegador ho bloqueja i ho
               apunta com a error a la consola. */
            var tocat = !navigator.userActivation || navigator.userActivation.hasBeenActive;
            if (navigator.vibrate && tocat) { try { navigator.vibrate(12); } catch (e) {} }
            App.brindis('«' + quin + '» apuntat ' + (APATS.filter(function (m) { return m.clau === apat; })[0] || { art: '' }).art);
            Cau.oblida('nutricio.');
            aplica(r, false, true);
            /* El formulari es queda obert i amb el cursor a punt: després d'un
               aliment normalment en ve un altre del mateix àpat. */
            enfocaCamp(apat);
          }).catch(function (err) {
            bt.disabled = false;
            bt.dataset.carregant = '0';
            diguesMal(err.message, null);
          });
        }

        bt.addEventListener('click', afegeix);

        bd.addEventListener('click', function () {
          if (!nom.value.trim()) { diguesMal('Per desar-lo cal el nom de l\'aliment.', nom); return; }
          if (!(num(kc.value) > 0)) { diguesMal('Per desar-lo cal saber-ne les kcal per 100 g.', kc); return; }
          netejaMal();
          bd.disabled = true;
          bd.dataset.carregant = '1';
          escriu('nutricio', 'desaAliment', {
            nom: nom.value.trim(), kcal100: num(kc.value), prot100: num(pr.value)
          }, quePinto()).then(function (r) {
            // La llista es munta cada cop que s'obre, o sigui que amb tenir
            // `aliments` al dia ja hi surt: `aplica` ho fa i, amb el tauler
            // obert, s'espera a repintar fins que el tanquis.
            Cau.oblida('nutricio.');
            bd.disabled = false;
            bd.dataset.carregant = '0';
            App.brindis('«' + nom.value.trim() + '» desat al rebost');
            aplica(r);
          }).catch(function (err) {
            bd.disabled = false;
            bd.dataset.carregant = '0';
            diguesMal(err.message, null);
          });
        });

        sec.querySelectorAll('[data-treu]').forEach(function (b) {
          b.addEventListener('click', function () {
            /* La creu és petita i va al costat del plat: preguntar-ho val un
               toc i estalvia haver de tornar a escriure els quatre camps. */
            var quin = b.dataset.quin || 'aquest aliment';
            App.confirma('Treure-ho de l\'àpat?',
              '<p>' + esc(quin) + '</p>',
              'Sí, treu-ho',
              function (bo) {
                escriu('nutricio', 'treu', { id: b.dataset.treu }, quePinto())
                  // Treure'n un és una cosa que vols veure feta: es pinta encara
                  // que tinguis el formulari de l'àpat obert.
                  .then(function (r) {
                    App.tancaModal();
                    App.brindis('«' + quin + '» tret de l\'àpat');
                    Cau.oblida('nutricio.'); aplica(r, false, true);
                  })
                  .catch(function (err) { bo.disabled = false; App.brindis(err.message, 'error'); });
              });
          });
        });
      });
    }

    // -------------------------------------------------------------- ajustos

    function obreAjustos() {
      var a = ajustos || {};
      var cos = App.modal('Objectius',
        '<div class="form-ajustos">' +
          camp('objectiuDeficit', 'Dèficit diari objectiu (kcal)', a.objectiuDeficit,
               'És el punt de control del dorsal: 500 vol dir arribar a ' + MENYS + '500.') +
          camp('objectiuProteina', 'Proteïna diària objectiu (g)', a.objectiuProteina) +
          '<button class="btn btn-primari" type="button" data-desa-ajustos>Desa els objectius</button>' +
          '<hr>' +
          '<h3 class="marge">Avisos al mòbil</h3>' +
          '<div class="form-ajustos" data-estat-avisos>' + estatAvisos() + '</div>' +
          '<hr>' +
          '<h3 class="marge">Portar-hi les dades de FitFat</h3>' +
          '<p>Tria el fitxer de «⚙ → Còpia de seguretat → Exporta». ' +
            'Primer et diré què hi trobo i què faria; no s\'escriu res fins que ho confirmis. ' +
            'No esborra ni sobreescriu mai res, i es pot repetir sense duplicar.</p>' +
          '<label class="camp"><span>Còpia de FitFat (.json)</span>' +
            '<input class="entrada" type="file" accept="application/json,.json" data-fitxer></label>' +
          '<div id="aj-import" aria-live="polite"></div>' +
        '</div>');

      lligaImportacio(cos);

      var ba = cos.querySelector('[data-avisos-full]');
      if (ba) ba.addEventListener('click', function () {
        ba.dataset.carregant = '1';
        Notificacions.activa()
          .then(function () { App.brindis('Avisos activats en aquest aparell'); })
          .catch(function (err) { App.brindis(err.message, 'error'); })
          .then(function () {
            var lloc = cos.querySelector('[data-estat-avisos]');
            if (lloc) lloc.innerHTML = estatAvisos();
            var c = arrel.querySelector('.crida-avisos');
            if (c) c.outerHTML = cridaAvisos();
          });
      });

      var bd = cos.querySelector('[data-desa-ajustos]');
      bd.addEventListener('click', function () {
        var p = {};
        cos.querySelectorAll('[data-c]').forEach(function (i) { p[i.dataset.c] = i.value; });
        bd.dataset.carregant = '1';
        escriu('nutricio', 'desaAjustos', p, quePinto())
          .then(function (r) {
            App.tancaModal();
            App.brindis('Objectius desats');
            Cau.oblida('nutricio.');
            aplica(r);
          })
          .catch(function (err) { bd.dataset.carregant = '0'; App.brindis(err.message, 'error'); });
      });
    }

    /**
     * Importació en dos temps: primer un assaig que no escriu res i diu què
     * faria, i només després l'escriptura. Amb dades que només existeixen en
     * un telèfon, ensenyar el resultat abans de tocar-les no és una cortesia.
     */
    function lligaImportacio(cos) {
      var fitxer = cos.querySelector('[data-fitxer]');
      var sortida = cos.querySelector('#aj-import');
      if (!fitxer) return;

      fitxer.addEventListener('change', function () {
        var f = fitxer.files && fitxer.files[0];
        if (!f) return;
        sortida.innerHTML = '<p class="menut">Llegint el fitxer…</p>';

        var lector = new FileReader();
        lector.onerror = function () {
          sortida.innerHTML = '<div class="assaig" data-avis><p>No he pogut llegir el fitxer. Torna a triar-lo.</p></div>';
        };
        lector.onload = function () {
          var text = String(lector.result || '');
          crida('nutricio', 'importaFitFat', { dades: text, simulacio: true })
            .then(function (r) { mostraAssaig(r, text); })
            .catch(function (err) {
              sortida.innerHTML = '<div class="assaig" data-avis><p>' + esc(err.message) + '</p></div>';
            });
        };
        lector.readAsText(f);
      });

      function mostraAssaig(r, text) {
        var res = (r.ingestes || 0) + (r.aliments || 0) + (r.activitats || 0);
        sortida.innerHTML =
          '<div class="assaig">' +
            '<p class="marge">Què hi he trobat</p>' +
            /* Amb un fitxer que no és una còpia de FitFat, els comptadors no
               hi són i sortia «undefined dies amb activitat». */
            '<p>' + (r.ingestes || 0) + ' ingestes · ' + (r.activitats || 0) + ' dies amb activitat · ' +
              (r.aliments || 0) + ' aliments' +
              (r.jaHiEren ? ' · ' + r.jaHiEren + ' que ja hi eren i no tornaré a posar' : '') + '</p>' +
            (r.ajustos ? '<p class="menut">També hi ha objectius i dades del cos.</p>' : '') +
            (r.avisos && r.avisos.length
              ? '<p class="camp-mal">' + r.avisos.map(esc).join('<br>') + '</p>' : '') +
            (res > 0
              ? '<button class="btn btn-primari btn-ple" type="button" data-confirma>Importa-ho</button>'
              : '<p class="menut">No hi ha res de nou per importar.</p>') +
          '</div>';

        var b = sortida.querySelector('[data-confirma]');
        if (!b) return;
        b.addEventListener('click', function () {
          b.disabled = true;
          b.textContent = 'Important…';
          crida('nutricio', 'importaFitFat', { dades: text, simulacio: false })
            .then(function (fet) {
              sortida.innerHTML = '<div class="assaig"><p>Importat: ' + fet.ingestes + ' ingestes, ' +
                fet.activitats + ' dies i ' + fet.aliments + ' aliments.</p></div>';
              App.brindis('Dades de FitFat importades');
              Cau.oblida('nutricio.');
              carrega();
            })
            .catch(function (err) {
              b.disabled = false;
              b.textContent = 'Torna-ho a provar';
              App.brindis(err.message, 'error');
            });
        });
      }
    }

    function camp(clau, etiqueta, valor, ajuda) {
      return '<label><span>' + esc(etiqueta) + '</span>' +
             '<input data-c="' + clau + '" inputmode="numeric" class="num" value="' +
             esc(valor === undefined || valor === null || valor === 0 ? '' : String(valor)) + '" autocomplete="off">' +
             (ajuda ? '<small class="menut" style="display:block;margin-top:var(--e1)">' + esc(ajuda) + '</small>' : '') +
             '</label>';
    }

    // --------------------------------------------------------------- càrrega

    /* PRIMER EL QUE JA SABEM, DESPRÉS EL QUE ARRIBA.
       Una petició a Apps Script costa entre un segon i mig i dos i mig i això
       no ho arregla cap codi nostre: és la plataforma. El que sí que podem
       arreglar és esperar-la amb la pantalla en blanc. */
    function claCau() { return 'nutricio.' + periode + '.' + data; }

    var previPintat = null;   // JSON de les dades que hi ha pintades ara
    var ajornat = null;       // pantalla que espera que pari de tocar coses

    /**
     * Rebre una pantalla i pintar-la si toca.
     *
     * La torna tant `pantalla` com qualsevol escriptura —vegeu `escriu()`—,
     * perquè desar i tornar a demanar el dia eren dos viatges al servidor i a
     * Apps Script el viatge és tot el cost.
     *
     * NO REFER LA PANTALLA SI NO CAL: si el servidor diu exactament el mateix
     * que ja teníem, repintar només serveix per destruir el que tinguis obert
     * o a mig escriure. I si ha canviat però estàs tocant alguna cosa,
     * s'espera que acabis.
     *
     * @param forca  Repinta encara que tinguis un camp obert. Després
     *   d'AFEGIR un aliment el formulari es queda obert i amb el cursor al
     *   nom —a posta—, o sigui que sempre hi ha un camp enfocat: sense això,
     *   l'aliment que acabaves d'apuntar no sortia MAI a la llista. Quan el que
     *   ha canviat és conseqüència del que acabes de fer tu, i els camps ja
     *   han quedat buits, no hi ha res a protegir: es pinta.
     */
    function aplica(r, dEnCau, forca) {
      if (r.aliments && r.aliments.length) aliments = r.aliments;
      ajustos = r.ajustos || ajustos;
      Cau.set(claCau(), r);

      var nou = JSON.stringify(r.dades);
      if (nou === previPintat) return;

      /* Només té sentit ajornar si ja hi ha alguna cosa pintada: si la
         pantalla és buida, repintar no pot destruir res i no fer-ho et deixa
         mirant l'esquelet de càrrega per sempre. */
      if (!forca && previPintat !== null && App.interactuant()) {
        var primer = !ajornat;
        ajornat = r;
        if (primer) setTimeout(quanPari, 400);
        return;
      }
      previPintat = nou;
      App.mantenintLaVista(function () {
        if (periode === 'dia') pintaDia(r.dades, !!dEnCau); else pintaPeriode(r.dades);
      });
    }

    /* Es mira cada tant si ja ha acabat, en comptes d'esperar que salti el
       focus. Un tauler obert sense cap camp enfocat no dispara `focusout` en
       tancar-se, i llavors el que hi ha ajornat no es pinta mai. */
    function quanPari() {
      if (!arrel.isConnected) { ajornat = null; return; }
      if (App.interactuant()) { setTimeout(quanPari, 400); return; }
      var r = ajornat;
      ajornat = null;
      if (r) aplica(r);
    }

    /**
     * SENSE DADES, PERÒ AMB EL TAULER.
     * L'error ocupava la pantalla sencera i s'enduia el canvi de dia i de
     * període: si aquell dia no hi era al telèfon, no podies anar a un altre
     * que sí. I amb la franja de «Sense connexió» a dalt, el títol de l'error
     * deia el mateix dues vegades: aquí es diu què passa amb AQUEST dia.
     */
    function pintaError(err) {
      var e = err;
      if (err && err.xarxa) {
        e = { xarxa: true, message: 'Aquest ' + (periode === 'dia' ? 'dia' : periode) +
              ' no és al telèfon. Quan tornis a tenir cobertura, es carregarà.' };
      }
      arrel.innerHTML = '<div class="envoltori">' + capcalera(data >= fmt.avui()) +
        Comp.error(e, true) + '</div>';
      // «Torna a avui» quan ja hi ets no porta enlloc.
      var ja = arrel.querySelector('[data-va-inici]');
      if (ja && data >= fmt.avui() && periode === 'dia') ja.remove();
      lligaCapcalera();
    }

    /** Els paràmetres que necessita `pantalla` per tornar el que mirem ara. */
    function quePinto() { return { periode: periode, data: data }; }

    function carrega() {
      var desat = Cau.get(claCau(), null);
      if (desat && desat.dades) {
        aliments = desat.aliments && desat.aliments.length ? desat.aliments : aliments;
        ajustos = desat.ajustos || ajustos;
        try {
          previPintat = JSON.stringify(desat.dades);
          if (periode === 'dia') pintaDia(desat.dades, true); else pintaPeriode(desat.dades);
        } catch (e) { previPintat = null; }
      }

      crida('nutricio', 'pantalla', quePinto())
        .then(function (r) { aplica(r); })
        .catch(function (err) {
          if (desat) App.brindis(err.message, 'error');
          else pintaError(err);
        });
    }

    arrel.innerHTML = Comp.carregant(3);
    carrega();
  }
});
</script>
